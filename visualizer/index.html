<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Back Track King — replay viewer</title>
<style>
  :root { color-scheme:dark; --bg:#14171c; --panel:#1e232b; --fg:#e6e6e6; --muted:#9aa4b2; --p0:#e4553f; --p1:#3f8fe4; --neutral:#9c9c9c; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--fg); font:13px/1.4 system-ui, Segoe UI, sans-serif; display:flex; height:100vh; }
  #left { flex:1; display:flex; flex-direction:column; min-width:0; }
  #canvasWrap { flex:1; position:relative; min-height:180px; }
  canvas { position:absolute; inset:0; width:100%; height:100%; }
  #controls { padding:8px 12px; background:var(--panel); display:flex; gap:8px; align-items:center; flex-wrap:wrap; }
  #controls input[type=range] { flex:1; min-width:200px; }
  button, select { background:#2c3440; color:var(--fg); border:1px solid #3b4553; border-radius:4px; padding:4px 10px; }
  button { cursor:pointer; }
  button:hover { background:#38424f; }
  button:disabled { opacity:.45; cursor:default; }
  button:focus-visible, input:focus-visible, select:focus-visible { outline:2px solid #a0c4ff; outline-offset:2px; }
  #side { width:360px; flex-shrink:0; background:var(--panel); padding:12px; overflow:auto; border-left:1px solid #2c3440; }
  h3 { margin:12px 0 6px; font-size:13px; color:var(--muted); text-transform:uppercase; letter-spacing:.05em; }
  .p0 { color:#ff947f; --player:var(--p0); } .p1 { color:#85bdff; --player:var(--p1); }
  .player { display:grid; grid-template-columns:minmax(0,1fr) auto; gap:4px 12px; align-items:center; padding:10px 12px; margin:6px 0; border:1px solid #35404d; border-left:4px solid var(--player); border-radius:6px; background:#181d24; }
  .player-name { font-size:14px; font-weight:600; overflow-wrap:anywhere; }
  .slot { display:inline-block; margin-right:6px; font:11px Consolas,monospace; opacity:.85; }
  .score { font-size:26px; font-weight:700; line-height:1.1; font-variant-numeric:tabular-nums; text-align:right; }
  .gain { font-size:12px; font-variant-numeric:tabular-nums; text-align:right; }
  .player-status, .muted { color:var(--muted); font-size:12px; }
  .player.winner { border-color:var(--player); }
  #scoreStatus { margin:6px 0 12px; }
  .seed-row { display:flex; align-items:center; gap:8px; margin:8px 0; }
  #seed { min-width:0; flex:1; overflow-wrap:anywhere; }
  #copySeed { font-size:11px; padding:3px 7px; }
  #dimensions { margin-top:6px; }
  .action { margin:8px 0; padding-left:8px; border-left:2px solid var(--player); }
  .action-name { font-weight:600; font-size:12px; margin-bottom:3px; overflow-wrap:anywhere; }
  .action .mono { color:var(--fg); word-break:normal; overflow-wrap:anywhere; }
  .mono { font-family: Consolas, monospace; font-size:12px; white-space:pre-wrap; word-break:break-all; }
  #meta { word-break:normal; overflow-wrap:anywhere; }
  .err { color:#ff7b6b; }
  #drop { border:1px dashed #3b4553; border-radius:6px; padding:8px; text-align:center; color:var(--muted); font-size:12px; }
  #file { max-width:100%; margin-top:4px; }
  #drop.over { border-color:#7fb3ff; color:#fff; }
  label.chk { margin-right:10px; user-select:none; }
  table { border-collapse:collapse; width:100%; }
  th, td { padding:4px; border-bottom:1px solid #2c3440; text-align:right; font-variant-numeric:tabular-nums; }
  th { color:var(--muted); font-size:11px; font-weight:500; }
  th:first-child, td:first-child { text-align:left; }
  #hover { min-height:60px; }
  @media (max-width:680px) {
    body { height:auto; min-height:100vh; flex-direction:column; }
    #left { flex:none; height:65vh; min-height:320px; }
    #side { width:100%; overflow:visible; border-left:0; border-top:1px solid #2c3440; }
  }
</style>
</head>
<body>
<div id="left">
  <div id="canvasWrap"><canvas id="c"></canvas></div>
  <div id="controls">
    <button id="first" title="Initial position (Home)" aria-label="Initial position">⏮</button>
    <button id="prev" title="Previous turn (←)" aria-label="Previous turn">◀</button>
    <button id="play" title="Play / pause (Space)" aria-label="Play">▶</button>
    <button id="next" title="Next turn (→)" aria-label="Next turn">▶|</button>
    <button id="last" title="Final position (End)" aria-label="Final position">⏭</button>
    <input type="range" id="slider" min="0" max="0" value="0" aria-label="Replay turn">
    <span id="turnLabel" class="mono">turn 0/0</span>
    <select id="speed" aria-label="Playback speed"><option value="800">1x</option><option value="400">2x</option><option value="160" selected>5x</option><option value="60">13x</option></select>
    <label class="chk"><input type="checkbox" id="showPaths" checked> paths</label>
    <label class="chk"><input type="checkbox" id="showRegions"> region ids</label>
    <label class="chk"><input type="checkbox" id="showGrid" checked> grid</label>
  </div>
</div>
<div id="side">
  <div id="drop">Drop a replay JSON here or <input type="file" id="file" accept=".json"></div>
  <h3>Game</h3>
  <div id="meta">No replay loaded</div>
  <div class="seed-row"><span class="muted">Seed</span><span id="seed" class="mono">—</span><button id="copySeed" disabled title="Copy exact seed">Copy</button></div>
  <div id="dimensions" class="muted"></div>
  <h3 id="scoreHeading">Score</h3>
  <div class="player p0" id="player0">
    <div class="player-name"><span class="slot">P0</span><span id="name0">Player 0</span></div><div class="score" id="s0">0</div>
    <div class="player-status" id="status0">—</div><div class="gain" id="gain0">—</div>
  </div>
  <div class="player p1" id="player1">
    <div class="player-name"><span class="slot">P1</span><span id="name1">Player 1</span></div><div class="score" id="s1">0</div>
    <div class="player-status" id="status1">—</div><div class="gain" id="gain1">—</div>
  </div>
  <div id="scoreStatus" class="muted">Load a replay to inspect each turn.</div>
  <h3>Actions this turn</h3>
  <div class="action p0"><div class="action-name" id="actionName0">P0</div><div class="mono" id="a0">—</div></div>
  <div class="action p1"><div class="action-name" id="actionName1">P1</div><div class="mono" id="a1">—</div></div>
  <div id="errs" class="mono err"></div>
  <h3>Active connections <span id="pathCount"></span></h3>
  <table aria-label="Track ownership on active connections"><thead><tr><th>Route</th><th>Length</th><th class="p0" id="owner0">P0</th><th class="p1" id="owner1">P1</th><th>Shared</th></tr></thead><tbody id="paths"></tbody></table>
  <h3>Cell</h3>
  <div id="hover" class="mono">hover the map</div>
  <h3>Keys</h3>
  <div class="mono" style="color:var(--muted)">space play/pause · ← → step · home/end</div>
</div>
<script src="bot-labels.js"></script>
<script>
'use strict';
const TERRAIN = ['#3d6b3a', '#2b5c8a', '#6e6a62'];
const PAIR_COLORS = ['#ffd166','#06d6a0','#ef476f','#118ab2','#f78c6b','#c77dff','#8ac926','#ff99c8','#00bbf9','#f15bb5','#fee440','#9b5de5','#00f5d4','#ff924c','#a0c4ff','#bdb2ff'];

let replay = null, turn = 0, timer = null;
let ownerByTurn = [];      // ownerByTurn[t] = Int8Array owner state AFTER turn t-1 (t=0: initial)
let hoverCell = -1;
let botCatalogEntries = [];
let playerNames = ['Player 0', 'Player 1'];
let exactSeed = null;

const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
const $ = id => document.getElementById(id);

// Old local replays have only ids. New ones carry their recorded labels and need no catalog fetch.
fetch('../src/main/resources/btk/bot/catalog.json').then(r => {
  if (!r.ok) throw new Error('catalog unavailable');
  return r.json();
}).then(catalog => {
  botCatalogEntries = Array.isArray(catalog.entries) ? catalog.entries : [];
  if (replay) showMeta();
}).catch(() => {}); // Standalone/offline viewer keeps recorded labels or original ids.

function showMeta() {
  const m = replay.meta;
  playerNames = [0, 1].map(p => BtkBotLabels.label(m, p, botCatalogEntries));
  const source = {'cg-bot':'CG boss', 'cg-arena':'CG arena', local:'Local game'}[m.source] || m.source || 'Replay';
  $('meta').textContent = `${source}${m.gameId ? ' · #' + m.gameId : ''}`;
  // Old CG exports used a dummy zero. Never display that or a rounded 64-bit number as a real seed.
  exactSeed = typeof m.seedText === 'string' && /^-?\d+$/.test(m.seedText) ? m.seedText :
    Number.isSafeInteger(m.seed) && (m.source === 'local' || m.seed !== 0) ? String(m.seed) : null;
  $('seed').textContent = exactSeed ?? 'unknown';
  $('seed').title = exactSeed === null ? 'Seed is missing or was not preserved exactly. Re-render the canonical replay.' : exactSeed;
  $('copySeed').disabled = exactSeed === null;
  $('copySeed').textContent = 'Copy';
  $('dimensions').textContent = `${replay.map.width} × ${replay.map.height} · ${replay.map.towns.length} towns · ${replay.map.pairs.length} routes · ${replay.turns.length} turns`;
  for (let p = 0; p < 2; p++) {
    $('name' + p).textContent = playerNames[p];
    $('actionName' + p).textContent = `P${p} · ${playerNames[p]}`;
    $('owner' + p).title = `${playerNames[p]}: owned track cells`;
  }
  showScore();
}

function load(json) {
  if (!json?.meta || !json.map || !Array.isArray(json.turns)) throw new Error('Expected a rendered replay; use cgRender for canonical CG files.');
  stopPlay();
  replay = json;
  turn = 0;
  hoverCell = -1;
  const size = replay.map.width * replay.map.height;
  ownerByTurn = [new Int8Array(size).fill(-1)];
  for (const t of replay.turns) {
    const o = Int8Array.from(ownerByTurn[ownerByTurn.length - 1]);
    for (const [cell, owner] of t.placed) o[cell] = owner;
    ownerByTurn.push(o);
  }
  $('slider').max = replay.turns.length;
  showMeta();
  setTurn(0);
}

function showScore() {
  const tr = turn > 0 ? replay.turns[turn - 1] : null;
  const final = turn === replay.turns.length;
  const score = final && replay.meta.score ? replay.meta.score : tr?.score ?? [0, 0];
  $('scoreHeading').textContent = final ? 'Final score' : turn === 0 ? 'Initial score' : `Score · turn ${turn}`;
  for (let p = 0; p < 2; p++) {
    $('s' + p).textContent = score[p];
    const gain = tr?.gained?.[p];
    $('gain' + p).textContent = gain == null ? '—' : `${gain >= 0 ? '+' : ''}${gain} this turn`;
    $('status' + p).textContent = final ? (replay.meta.winner < 0 ? 'Draw' : replay.meta.winner === p ? 'Winner' : 'Defeat') : 'Total points';
    $('player' + p).classList.toggle('winner', final && replay.meta.winner === p);
  }
  const leader = score[0] === score[1] ? -1 : score[0] > score[1] ? 0 : 1;
  $('scoreStatus').textContent = final ? (replay.meta.winner < 0 ? 'Game finished · draw' : `${playerNames[replay.meta.winner]} won`) :
    turn === 0 ? 'Before the first turn' : leader < 0 ? 'Scores are tied' : `${playerNames[leader]} leads by ${Math.abs(score[0] - score[1])}`;
}

function setTurn(t) {
  if (!replay) return;
  turn = Math.max(0, Math.min(replay.turns.length, t));
  $('slider').value = turn;
  $('turnLabel').textContent = `turn ${turn}/${replay.turns.length}`;
  const tr = turn > 0 ? replay.turns[turn - 1] : null;
  showScore();
  $('a0').textContent = tr ? (tr.actions[0] ?? '—') : '—';
  $('a1').textContent = tr ? (tr.actions[1] ?? '—') : '—';
  $('errs').textContent = tr ? [0, 1].filter(p => tr.errors[p]).map(p => `P${p}: ${tr.errors[p]}`).join('\n') : '';
  const rows = [];
  if (tr) for (const [pi, cells] of tr.paths) {
    const [a, b] = replay.map.pairs[pi];
    const o = ownerByTurn[turn];
    let c0 = 0, c1 = 0, cn = 0;
    for (const c of cells) { if (o[c] === 0) c0++; else if (o[c] === 1) c1++; else if (o[c] === 2) cn++; }
    rows.push(`<tr><td><span style="color:${PAIR_COLORS[pi % PAIR_COLORS.length]}">■</span> ${a}→${b}</td><td>${cells.length}</td><td class="p0">${c0}</td><td class="p1">${c1}</td><td style="color:var(--neutral)">${cn}</td></tr>`);
  }
  $('pathCount').textContent = `(${rows.length})`;
  $('paths').innerHTML = rows.join('') || '<tr><td colspan="5" class="muted">No active connections</td></tr>';
  showHover();
  draw();
}

function geometry() {
  const W = canvas.clientWidth, H = canvas.clientHeight;
  const { width: gw, height: gh } = replay.map;
  const cs = Math.max(1, Math.floor(Math.min((W - 20) / gw, (H - 20) / gh)));
  return { cs, ox: Math.floor((W - cs * gw) / 2), oy: Math.floor((H - cs * gh) / 2), gw, gh };
}

function draw() {
  const dpr = window.devicePixelRatio || 1;
  canvas.width = canvas.clientWidth * dpr; canvas.height = canvas.clientHeight * dpr;
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.clearRect(0, 0, canvas.clientWidth, canvas.clientHeight);
  if (!replay) { ctx.fillStyle = '#9aa4b2'; ctx.font = '16px system-ui'; ctx.fillText('Load a replay JSON (drag & drop)', 20, 40); return; }
  const g = geometry();
  const { cs, ox, oy, gw, gh } = g;
  const map = replay.map, owner = ownerByTurn[turn];
  const tr = turn > 0 ? replay.turns[turn - 1] : null;
  const regionInstability = tr?.regionInstability ?? [];
  const regionInked = tr?.regionInked ?? [];
  const placedNow = new Set(tr ? tr.placed.map(p => p[0]) : []);
  // terrain
  for (let y = 0; y < gh; y++) for (let x = 0; x < gw; x++) {
    const c = y * gw + x;
    ctx.fillStyle = TERRAIN[map.terrain[c]];
    ctx.fillRect(ox + x * cs, oy + y * cs, cs, cs);
  }
  // A region is outlined more heavily after each sabotage, then permanently inked at four.
  for (let y = 0; y < gh; y++) for (let x = 0; x < gw; x++) {
    const c = y * gw + x;
    if (!regionInked[map.region[c]]) continue;
    ctx.fillStyle = '#242424';
    ctx.fillRect(ox + x * cs, oy + y * cs, cs, cs);
  }
  // grid + region borders
  ctx.lineWidth = 1;
  if ($('showGrid').checked) {
    ctx.strokeStyle = 'rgba(0,0,0,0.25)';
    for (let x = 0; x <= gw; x++) { ctx.beginPath(); ctx.moveTo(ox + x * cs + .5, oy); ctx.lineTo(ox + x * cs + .5, oy + gh * cs); ctx.stroke(); }
    for (let y = 0; y <= gh; y++) { ctx.beginPath(); ctx.moveTo(ox, oy + y * cs + .5); ctx.lineTo(ox + gw * cs, oy + y * cs + .5); ctx.stroke(); }
  }
  ctx.strokeStyle = 'rgba(0,0,0,0.85)'; ctx.lineWidth = 2;
  for (let y = 0; y < gh; y++) for (let x = 0; x < gw; x++) {
    const c = y * gw + x;
    if (x + 1 < gw && map.region[c] !== map.region[c + 1]) { ctx.beginPath(); ctx.moveTo(ox + (x + 1) * cs, oy + y * cs); ctx.lineTo(ox + (x + 1) * cs, oy + (y + 1) * cs); ctx.stroke(); }
    if (y + 1 < gh && map.region[c] !== map.region[c + gw]) { ctx.beginPath(); ctx.moveTo(ox + x * cs, oy + (y + 1) * cs); ctx.lineTo(ox + (x + 1) * cs, oy + (y + 1) * cs); ctx.stroke(); }
  }
  // Draw only the outer edges of unstable regions. Higher instability means a thicker outline.
  for (let level = 1; level < 4; level++) {
    ctx.beginPath();
    for (let y = 0; y < gh; y++) for (let x = 0; x < gw; x++) {
      const c = y * gw + x, region = map.region[c];
      if (regionInked[region] || regionInstability[region] !== level) continue;
      const x0 = ox + x * cs, y0 = oy + y * cs, x1 = x0 + cs, y1 = y0 + cs;
      if (y === 0 || map.region[c - gw] !== region) { ctx.moveTo(x0, y0); ctx.lineTo(x1, y0); }
      if (x === gw - 1 || map.region[c + 1] !== region) { ctx.moveTo(x1, y0); ctx.lineTo(x1, y1); }
      if (y === gh - 1 || map.region[c + gw] !== region) { ctx.moveTo(x1, y1); ctx.lineTo(x0, y1); }
      if (x === 0 || map.region[c - 1] !== region) { ctx.moveTo(x0, y1); ctx.lineTo(x0, y0); }
    }
    ctx.strokeStyle = 'rgba(8,8,8,0.96)';
    ctx.lineWidth = Math.max(3, Math.min(cs * 0.22, 2 + level * 1.6));
    ctx.lineJoin = 'round';
    ctx.stroke();
  }
  // tracks
  const pad = Math.max(2, Math.floor(cs * 0.22));
  for (let c = 0; c < owner.length; c++) {
    const o = owner[c]; if (o < 0) continue;
    const x = c % gw, y = Math.floor(c / gw);
    ctx.fillStyle = o === 0 ? '#e4553f' : o === 1 ? '#3f8fe4' : '#9c9c9c';
    ctx.fillRect(ox + x * cs + pad, oy + y * cs + pad, cs - 2 * pad, cs - 2 * pad);
    if (placedNow.has(c)) { ctx.strokeStyle = '#fff'; ctx.lineWidth = 2; ctx.strokeRect(ox + x * cs + pad - 1, oy + y * cs + pad - 1, cs - 2 * pad + 2, cs - 2 * pad + 2); }
  }
  // active paths
  if ($('showPaths').checked && tr) {
    ctx.lineWidth = Math.max(2, cs * 0.12); ctx.lineCap = 'round'; ctx.lineJoin = 'round';
    tr.paths.forEach(([pi, cells], k) => {
      ctx.strokeStyle = PAIR_COLORS[pi % PAIR_COLORS.length];
      ctx.globalAlpha = 0.85;
      const off = ((k % 3) - 1) * cs * 0.12;
      ctx.beginPath();
      cells.forEach((c, i) => {
        const px = ox + (c % gw) * cs + cs / 2 + off, py = oy + Math.floor(c / gw) * cs + cs / 2 + off;
        if (i === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
      });
      ctx.stroke();
      ctx.globalAlpha = 1;
    });
  }
  // towns
  for (const [id, x, y] of map.towns) {
    const cx = ox + x * cs + cs / 2, cy = oy + y * cs + cs / 2;
    ctx.fillStyle = '#f5f5f5'; ctx.beginPath(); ctx.arc(cx, cy, cs * 0.38, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = '#222'; ctx.lineWidth = 2; ctx.stroke();
    ctx.fillStyle = '#111'; ctx.font = `bold ${Math.max(9, cs * 0.5)}px system-ui`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText(id, cx, cy + 1);
  }
  // region ids
  if ($('showRegions').checked) {
    ctx.fillStyle = 'rgba(255,255,255,0.7)'; ctx.font = `${Math.max(8, cs * 0.35)}px system-ui`; ctx.textAlign = 'left'; ctx.textBaseline = 'top';
    for (let c = 0; c < map.region.length; c++) ctx.fillText(map.region[c], ox + (c % gw) * cs + 2, oy + Math.floor(c / gw) * cs + 1);
  }
  // hover
  if (hoverCell >= 0) {
    const x = hoverCell % gw, y = Math.floor(hoverCell / gw);
    ctx.strokeStyle = '#fff'; ctx.lineWidth = 2; ctx.strokeRect(ox + x * cs + 1, oy + y * cs + 1, cs - 2, cs - 2);
  }
}

canvas.addEventListener('mousemove', e => {
  if (!replay) return;
  const g = geometry(), r = canvas.getBoundingClientRect();
  const x = Math.floor((e.clientX - r.left - g.ox) / g.cs), y = Math.floor((e.clientY - r.top - g.oy) / g.cs);
  const c = (x >= 0 && y >= 0 && x < g.gw && y < g.gh) ? y * g.gw + x : -1;
  if (c === hoverCell) return;
  hoverCell = c;
  showHover();
  draw();
});
canvas.addEventListener('mouseleave', () => {
  hoverCell = -1;
  showHover();
  draw();
});

function showHover() {
  const c = hoverCell;
  if (!replay || c < 0) { $('hover').textContent = 'hover the map'; return; }
  const x = c % replay.map.width, y = Math.floor(c / replay.map.width);
  if (c >= 0) {
    const map = replay.map, o = ownerByTurn[turn][c];
    const tr = turn > 0 ? replay.turns[turn - 1] : null;
    const regionInstability = tr?.regionInstability ?? [];
    const regionInked = tr?.regionInked ?? [];
    const pairs = tr ? tr.paths.filter(([pi, cells]) => cells.includes(c)).map(([pi]) => map.pairs[pi].join('→')) : [];
    const town = map.towns.find(t => t[1] === x && t[2] === y);
    const region = map.region[c], sabotage = regionInked[region] ? 'inked' : `${regionInstability[region] ?? 0}/4`;
    $('hover').textContent = `(${x}, ${y})  cell ${c}\nregion ${map.region[c]}  terrain ${['plains','river','mountain'][map.terrain[c]]} (cost ${map.terrain[c] + 1})\n` +
      (town ? `TOWN ${town[0]} wants ${JSON.stringify(map.desired[town[0]])}\n` : '') +
      `sabotage: ${sabotage}\ntrack: ${o < 0 ? 'none' : o === 2 ? 'shared' : 'P' + o + ' · ' + playerNames[o]}\nconnections: ${pairs.join(', ') || '—'}`;
  }
}

function stopPlay() {
  clearInterval(timer);
  timer = null;
  $('play').textContent = '▶';
  $('play').setAttribute('aria-label', 'Play');
}
function togglePlay() {
  if (timer) { stopPlay(); return; }
  if (!replay || !replay.turns.length) return;
  if (turn >= replay.turns.length) setTurn(0);
  $('play').textContent = '⏸';
  $('play').setAttribute('aria-label', 'Pause');
  timer = setInterval(() => { setTurn(turn + 1); if (turn >= replay.turns.length) stopPlay(); }, +$('speed').value);
}
function seek(t) {
  stopPlay();
  setTurn(t);
}
$('play').onclick = togglePlay;
$('next').onclick = () => seek(turn + 1);
$('prev').onclick = () => seek(turn - 1);
$('first').onclick = () => seek(0);
$('last').onclick = () => seek(replay ? replay.turns.length : 0);
$('slider').oninput = e => seek(+e.target.value);
$('speed').onchange = () => { if (timer) { togglePlay(); togglePlay(); } };
for (const id of ['showPaths', 'showRegions', 'showGrid']) $(id).onchange = draw;
document.addEventListener('keydown', e => {
  if (!replay || ['INPUT', 'SELECT'].includes(e.target.tagName)) return;
  if (e.code === 'Space') { e.preventDefault(); togglePlay(); }
  else if (['ArrowRight', 'ArrowLeft', 'Home', 'End'].includes(e.key)) {
    e.preventDefault();
    seek(e.key === 'Home' ? 0 : e.key === 'End' ? replay.turns.length : turn + (e.key === 'ArrowRight' ? 1 : -1));
  }
});
window.addEventListener('resize', draw);

$('copySeed').onclick = async () => {
  if (exactSeed === null) return;
  try {
    await navigator.clipboard.writeText(exactSeed);
    $('copySeed').textContent = 'Copied';
  } catch {
    const selection = window.getSelection(), range = document.createRange();
    range.selectNodeContents($('seed'));
    selection.removeAllRanges(); selection.addRange(range);
    $('copySeed').textContent = 'Ctrl+C';
  }
};
function readFile(f) { const r = new FileReader(); r.onload = () => { try { load(JSON.parse(r.result)); } catch (e) { alert('bad replay: ' + e); } }; r.readAsText(f); }
$('file').onchange = e => e.target.files[0] && readFile(e.target.files[0]);
const drop = $('drop');
document.body.addEventListener('dragover', e => { e.preventDefault(); drop.classList.add('over'); });
document.body.addEventListener('dragleave', () => drop.classList.remove('over'));
document.body.addEventListener('drop', e => { e.preventDefault(); drop.classList.remove('over'); const f = e.dataTransfer.files[0]; if (f) readFile(f); });
const qs = new URLSearchParams(location.search).get('file');
if (qs) fetch(qs, {cache:'no-store'}).then(r => { if (!r.ok) throw new Error(`HTTP ${r.status}`); return r.json(); }).then(load).catch(e => alert('cannot load ' + qs + ': ' + e));
draw();
</script>
</body>
</html>
