# Fixed consumed parameters of neural-v1 (imitation policy trained on the arena leader's replays).
# The decision rules are the trained weights in btk.bot.neural.NeuralWeights; retraining produces a
# new weight file, never a Params change. Only symmetry breaking, the closing-ink guard and the
# sabotage switch are read from Params.
NOISE=0.1
SEED=1
USE_CLOSE=true
USE_DISRUPT=true
